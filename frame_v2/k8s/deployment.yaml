apiVersion: apps/v1
kind: Deployment
metadata:
  name: frame-v2
  labels:
    app: frame-v2
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frame-v2
  template:
    metadata:
      labels:
        app: frame-v2
    spec:
      containers:
      - name: frame-container
        image: balu051989/frame_v2-web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 4
          periodSeconds: 2
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sleep", "3"]
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: storage
          mountPath: /app/data
        env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_NAME
          value: "notepad"
        - name: DB_USER
          value: "notepad"
        - name: DB_PASSWORD
          value: "notepad"
        - name: REDIS_TTL
          value: "3600"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: frame-pvc
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: ssl-certs
        secret:
          secretName: frame-ssl-secret
