            video.addEventListener('click', () => {
                // First user gesture: ensure audio is on and play
                if (video.muted) {
                    video.muted = false;
                    localStorage.setItem('localVideoAudio', 'true');
                    updateLocalAudioButton(video, false);
                }
                video.play().catch(() => { });
            });

            const capturePoster = () => {
                try {
                    const canvas = document.createElement("canvas");
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 360;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    video.setAttribute("poster", dataUrl);
                } catch (e) { }
            };

            video.addEventListener("loadedmetadata", () => {
                const t = Math.min(0.1, Math.max(0, (video.duration || 1) / 2));
                video.currentTime = t;
            }, { once: true });

            video.addEventListener("seeked", () => {
                capturePoster();
                try { video.pause(); } catch (e) { }
                try { video.currentTime = 0; } catch (e) { }
                video.dataset.previewReady = "true";
            }, { once: true });

            video.addEventListener("play", () => {
                pauseOtherLocalVideos(video);
                if (video.muted) {
                    video.muted = false;
                    localStorage.setItem('localVideoAudio', 'true');
                    updateLocalAudioButton(video, false);
                }
                startPillUpdater();
                updateGlobalPlayButton(true);
                startLocalPillUpdater();
                updateLocalControlsButton(true);
            });

            video.addEventListener("ended", () => {
                playNextLocalVideo(video);
                stopPillUpdater();
                updateGlobalPlayButton(false);
                stopLocalPillUpdater();
                updateLocalControlsButton(false);
            });

            video.addEventListener("pause", () => {
                stopPillUpdater();
                updateGlobalPlayButton(false);
                stopLocalPillUpdater();
                updateLocalControlsButton(false);
            });

            video.addEventListener("timeupdate", updateLocalPillProgress);
        }

        function ensureLocalVideoHandlers(video) {
            if (video.dataset.handlersAttached === "true") return;
            video.addEventListener('click', () => {
                if (video.muted) {
                    video.muted = false;
                    localStorage.setItem('localVideoAudio', 'true');
                    updateLocalAudioButton(video, false);
                }
                video.play().catch(() => { });
            });

            video.addEventListener("play", () => {
                pauseOtherLocalVideos(video);
                if (video.muted) {
                    video.muted = false;
                    localStorage.setItem('localVideoAudio', 'true');
                    updateLocalAudioButton(video, false);
                }
                startPillUpdater();
                startLocalPillUpdater();
                updateLocalControlsButton(true);
            });

            video.addEventListener("ended", () => {
                playNextLocalVideo(video);
                stopPillUpdater();
                stopLocalPillUpdater();
                updateLocalControlsButton(false);
            });

            video.addEventListener("pause", () => {
                stopPillUpdater();
                stopLocalPillUpdater();
                updateLocalControlsButton(false);
            });

            video.addEventListener("timeupdate", updateLocalPillProgress);

            video.dataset.handlersAttached = "true";
        }

        function toggleLocalVideoAudio(btn) {
            const card = btn.closest('.video-card');
            if (!card) return;
            const video = card.querySelector('video');
            if (!video) return;
            video.muted = !video.muted;
            if (!video.muted) {
                localStorage.setItem('localVideoAudio', 'true');
            }
            updateLocalAudioButton(video, video.muted);
        }

        function pauseOtherLocalVideos(current) {
            document.querySelectorAll('.video-container video').forEach(v => {
                if (v !== current) {
                    try { v.pause(); } catch (e) { }
                }
            });
        }

        function playNextLocalVideo(current) {
            if (!localAutoPlay) return;
            const row = document.querySelector('.local-video-row');
            if (!row) return;
            const containers = Array.from(row.querySelectorAll('.video-container'));
            if (containers.length === 0) return;
            const currentContainer = current.closest('.video-container');
            const idx = containers.indexOf(currentContainer);
            if (idx < 0) return;
            // Find next local video only (skip YouTube iframes)
            let next = null;
            for (let i = idx + 1; i < containers.length; i++) {
                if (containers[i].querySelector('video')) { next = containers[i]; break; }
            }
            if (!next) {
                for (let i = 0; i < idx; i++) {
                    if (containers[i].querySelector('video')) { next = containers[i]; break; }
                }
            }
            if (!next) return;
            const nextVideo = next.querySelector('video');
            if (!nextVideo) return;
            const left = next.offsetLeft - row.offsetLeft;
            row.scrollTo({ left, behavior: 'smooth' });
            const audioAllowed = localStorage.getItem('localVideoAudio') === 'true';
            nextVideo.autoplay = true;
            nextVideo.currentTime = 0;
            const attempt = (allowSound) => {
                nextVideo.muted = !allowSound;
                updateLocalAudioButton(nextVideo, nextVideo.muted);
                return nextVideo.play();
            };
            // Delay to allow scroll/layout settle
            setTimeout(() => {
                attempt(audioAllowed).catch(() => {
                    // Autoplay with sound may be blocked; fallback to muted play
                    attempt(false).catch(() => { });
                });
            }, 300);
        }

        function toggleLocalAutoPlay() {
            localAutoPlay = !localAutoPlay;
            const btn = document.getElementById('localAutoBtn');
            if (btn) {
                btn.classList.toggle('is-active', localAutoPlay);
                btn.innerHTML = localAutoPlay ? '<i data-lucide="repeat"></i>' : '<i data-lucide="repeat-1"></i>';
            }
            lucide.createIcons();
        }

        function updateLocalAudioButton(video, muted) {
            const card = video.closest('.video-card');
            if (!card) return;
            const btn = card.querySelector('.video-audio-toggle');
            if (!btn) return;
            btn.innerHTML = muted ? '<i data-lucide="volume-x"></i>' : '<i data-lucide="volume-2"></i>';
            lucide.createIcons();
        }

        function setupImageCardAdaptive(imgEl) {
            if (!imgEl) return;
            const card = imgEl.closest('.image-card');
            const container = imgEl.closest('.image-container');
            if (!card) return;

            function applyDimensions() {
                const nw = imgEl.naturalWidth;
                const nh = imgEl.naturalHeight;
                if (!nw || !nh) return;

                // Set ambient background image variable for the blurred glow backdrop
                if (imgEl.src) {
                    card.style.setProperty('--card-bg-img', `url("${imgEl.src}")`);
                }

                const isPortrait = nh > nw * 1.05;
                const isLandscape = nw > nh * 1.05;
                const isSquare = !isPortrait && !isLandscape;

                if (container) {
                    container.classList.toggle('is-portrait', isPortrait);
                    container.classList.toggle('is-landscape', isLandscape);
                    container.classList.toggle('is-square', isSquare);

                    if (!container.querySelector('.image-fullscreen-trigger')) {
                        const fsBtn = document.createElement('button');
                        fsBtn.className = 'image-fullscreen-trigger';
                        fsBtn.title = 'Full Screen';
                        fsBtn.setAttribute('aria-label', 'Full Screen');
                        fsBtn.innerHTML = '<i data-lucide="maximize"></i>';
                        fsBtn.onclick = (e) => {
                            e.stopPropagation();
                            toggleImageCarouselFullscreen();
                        };
                        container.insertBefore(fsBtn, container.firstChild);
                        lucide.createIcons();
                    }
                }
                card.classList.toggle('is-portrait', isPortrait);
                card.classList.toggle('is-landscape', isLandscape);
                card.classList.toggle('is-square', isSquare);
                card.dataset.orientation = isPortrait ? 'portrait' : (isLandscape ? 'landscape' : 'square');

                // Enable high-performance touch pinch-to-zoom & pan on phone and iPad
                enableImagePinchZoom(card, imgEl);
            }

            if (imgEl.complete && imgEl.naturalWidth > 0) {
                applyDimensions();
            } else {
                imgEl.addEventListener('load', applyDimensions, { once: true });
            }
        }

        function resetAllImageZooms() {
            document.querySelectorAll('.image-card').forEach(c => {
                if (typeof c._resetZoom === 'function') c._resetZoom(true);
            });
        }

        function enableImagePinchZoom(card, imgEl) {
            if (!card || !imgEl || card._pinchZoomInitialized) return;
            card._pinchZoomInitialized = true;

            let scale = 1;
            let baseScale = 1;
            let startDist = 0;
            let startX = 0;
            let startY = 0;
            let posX = 0;
            let posY = 0;
            let basePosX = 0;
            let basePosY = 0;
            let isPinching = false;
            let isPanning = false;
            let lastTapTime = 0;
            let touchStartTime = 0;
            let touchStartY = 0;

            const getRow = () => card.closest('.image-row');

            function updateTransform(withTransition = false) {
                if (withTransition) {
                    imgEl.style.transition = 'transform 0.28s cubic-bezier(0.16, 1, 0.3, 1)';
                } else {
                    imgEl.style.transition = 'none';
                }
                const row = getRow();
                if (scale <= 1.02 && posX === 0 && posY === 0) {
                    imgEl.style.transform = '';
                    card.classList.remove('is-zoomed');
                    if (row) row.classList.remove('is-pinching');
                } else {
                    imgEl.style.transform = `translate3d(${posX}px, ${posY}px, 0px) scale(${scale})`;
                    card.classList.add('is-zoomed');
                    if (row) row.classList.add('is-pinching');
                }
            }

            function resetZoom(animated = true) {
                scale = 1;
                baseScale = 1;
                posX = 0;
                posY = 0;
                basePosX = 0;
                basePosY = 0;
                isPinching = false;
                isPanning = false;
                updateTransform(animated);
            }
            card._resetZoom = resetZoom;

            // Double-tap to zoom 2.5x or reset
            card.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (e.changedTouches.length === 1 && now - lastTapTime < 320 && now - touchStartTime < 300) {
                    e.preventDefault();
                    if (scale > 1.2) {
                        resetZoom(true);
                    } else {
                        scale = 2.5;
                        const rect = card.getBoundingClientRect();
                        const tapX = e.changedTouches[0].clientX - rect.left - rect.width / 2;
                        const tapY = e.changedTouches[0].clientY - rect.top - rect.height / 2;
                        posX = -tapX * 0.8;
                        posY = -tapY * 0.8;
                        updateTransform(true);
                    }
                    lastTapTime = 0;
                    return;
                }
                lastTapTime = now;
            }, { passive: false });

            // Touchstart
            card.addEventListener('touchstart', (e) => {
                touchStartTime = Date.now();
                const row = getRow();
                if (e.touches.length === 2) {
                    // Two-finger pinch start
                    e.preventDefault();
                    isPinching = true;
                    isPanning = false;
                    startDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    baseScale = scale;
                    basePosX = posX;
                    basePosY = posY;
                    startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    if (row) row.classList.add('is-pinching');
                    updateTransform(false);
                } else if (e.touches.length === 1) {
                    touchStartY = e.touches[0].clientY;
                    if (scale > 1.1) {
                        // One-finger pan start while zoomed
                        isPanning = true;
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        basePosX = posX;
                        basePosY = posY;
                        updateTransform(false);
                    }
                }
            }, { passive: false });

            // Touchmove
            card.addEventListener('touchmove', (e) => {
                if (isPinching && e.touches.length === 2) {
                    e.preventDefault();
                    const currentDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (startDist > 0) {
                        const ratio = currentDist / startDist;
                        scale = Math.min(Math.max(0.8, baseScale * ratio), 5); // 0.8x to 5x
                    }
                    const currentMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const currentMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    posX = basePosX + (currentMidX - startX);
                    posY = basePosY + (currentMidY - startY);
                    updateTransform(false);
                } else if (isPanning && e.touches.length === 1 && scale > 1.1) {
                    e.preventDefault();
                    const deltaX = e.touches[0].clientX - startX;
                    const deltaY = e.touches[0].clientY - startY;
                    posX = basePosX + deltaX;
                    posY = basePosY + deltaY;

                    // Restrict panning boundary
                    const maxPanX = (card.offsetWidth * (scale - 1)) / 1.8;
                    const maxPanY = (card.offsetHeight * (scale - 1)) / 1.8;
                    posX = Math.max(-maxPanX, Math.min(maxPanX, posX));
                    posY = Math.max(-maxPanY, Math.min(maxPanY, posY));

                    updateTransform(false);
                }
            }, { passive: false });

            // Touchend & Touchcancel
            const handleTouchEnd = (e) => {
                const carousel = card.closest('.image-carousel-container');
                const isFs = carousel && (document.fullscreenElement || carousel.classList.contains('is-fullscreen'));

                // iOS Photo-style swipe down to exit fullscreen when not zoomed
                if (isFs && scale <= 1.05 && e.changedTouches && e.changedTouches.length === 1) {
                    const deltaY = e.changedTouches[0].clientY - touchStartY;
                    if (deltaY > 110) {
                        toggleImageCarouselFullscreen();
                        return;
                    }
                }

                if (isPinching && e.touches.length < 2) {
                    isPinching = false;
                    if (scale < 1.05) {
                        resetZoom(true);
                    } else {
                        const maxPanX = (card.offsetWidth * (scale - 1)) / 1.8;
                        const maxPanY = (card.offsetHeight * (scale - 1)) / 1.8;
                        posX = Math.max(-maxPanX, Math.min(maxPanX, posX));
                        posY = Math.max(-maxPanY, Math.min(maxPanY, posY));
                        updateTransform(true);
                    }
                } else if (isPanning && e.touches.length === 0) {
                    isPanning = false;
                    if (scale <= 1.05) {
                        resetZoom(true);
                    }
                }
            };

            card.addEventListener('touchend', handleTouchEnd);
            card.addEventListener('touchcancel', handleTouchEnd);

            // Double click on desktop toggles fullscreen
            card.addEventListener('dblclick', (e) => {
                if (e.target.closest('.image-delete') || e.target.closest('.image-select') || e.target.closest('.image-fullscreen-trigger')) return;
                toggleImageCarouselFullscreen();
            });
        }

        function toggleImageCarouselFullscreen() {
            const carousel = document.querySelector('.image-carousel-container');
            if (!carousel) return;

            const isCurrentlyFs = Boolean(
                document.fullscreenElement ||
                document.webkitFullscreenElement ||
                carousel.classList.contains('is-fullscreen')
            );

            const fsBtn = document.getElementById('imageFullscreenBtn');

            if (!isCurrentlyFs) {
                // Enter fullscreen
                carousel.classList.add('is-fullscreen');
                document.body.classList.add('image-fullscreen-active');
                document.documentElement.classList.add('image-fullscreen-active');

                // Try HTML5 Fullscreen API (Desktop Chrome/Firefox/Safari and iPadOS)
                if (carousel.requestFullscreen) {
                    carousel.requestFullscreen().catch(() => {});
                } else if (carousel.webkitRequestFullscreen) {
                    carousel.webkitRequestFullscreen();
                }

                if (fsBtn) {
                    fsBtn.classList.add('is-active');
                    fsBtn.title = 'Exit Full Screen';
                    fsBtn.setAttribute('aria-label', 'Exit Full Screen');
                    fsBtn.innerHTML = '<i data-lucide="minimize"></i>';
                    lucide.createIcons();
                }

                // Center active slide
                const row = carousel.querySelector('.image-row');
                if (row) {
                    setTimeout(() => {
                        const width = row.offsetWidth || window.innerWidth;
                        const activeIndex = Math.round(row.scrollLeft / width);
                        row.scrollTo({ left: activeIndex * width, behavior: 'instant' });
                    }, 50);
                }
            } else {
                // Exit fullscreen
                carousel.classList.remove('is-fullscreen');
                document.body.classList.remove('image-fullscreen-active');
                document.documentElement.classList.remove('image-fullscreen-active');

                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }

                if (fsBtn) {
                    fsBtn.classList.remove('is-active');
                    fsBtn.title = 'Native Full Screen';
                    fsBtn.setAttribute('aria-label', 'Native Full Screen');
                    fsBtn.innerHTML = '<i data-lucide="maximize"></i>';
                    lucide.createIcons();
                }

                resetAllImageZooms();

                const row = carousel.querySelector('.image-row');
                if (row) {
                    setTimeout(() => {
                        const width = row.offsetWidth || 1;
                        const activeIndex = Math.round(row.scrollLeft / (window.innerWidth || width));
                        row.scrollTo({ left: activeIndex * width, behavior: 'instant' });
                    }, 50);
                }
            }
        }

        // Fullscreen state listeners
        document.addEventListener('fullscreenchange', () => {
            const carousel = document.querySelector('.image-carousel-container');
            if (!carousel) return;
            const isFs = Boolean(document.fullscreenElement);
            if (!isFs && carousel.classList.contains('is-fullscreen')) {
                toggleImageCarouselFullscreen();
            }
        });
        document.addEventListener('webkitfullscreenchange', () => {
            const carousel = document.querySelector('.image-carousel-container');
            if (!carousel) return;
            const isFs = Boolean(document.webkitFullscreenElement);
            if (!isFs && carousel.classList.contains('is-fullscreen')) {
                toggleImageCarouselFullscreen();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const carousel = document.querySelector('.image-carousel-container');
                if (carousel && carousel.classList.contains('is-fullscreen')) {
                    toggleImageCarouselFullscreen();
                }
            }
        });

        function toggleImageFitMode(btn) {
            const carousel = document.querySelector('.image-carousel-container');
            if (!carousel) return;
            const isFill = carousel.classList.toggle('fill-mode');
            const fitBtn = btn || document.getElementById('imageFitBtn');
            if (fitBtn) {
                fitBtn.classList.toggle('is-active', isFill);
                fitBtn.title = isFill ? 'Fit to Slide (Contain)' : 'Fill Slide (Cover)';
                fitBtn.setAttribute('aria-label', fitBtn.title);
                fitBtn.innerHTML = isFill ? '<i data-lucide="minimize-2"></i>' : '<i data-lucide="scan"></i>';
                lucide.createIcons();
            }
        }

        function renderImageIndicators() {
            const row = document.querySelector('.image-row');
            const holder = document.querySelector('.img-indicators');
            if (!row || !holder) return;
            row.querySelectorAll('.image-card img').forEach(setupImageCardAdaptive);
            const images = row.querySelectorAll('.image-container');
            const total = images.length;
            const maxDots = 12;
            holder.innerHTML = '';
            const visible = Math.min(total, maxDots);
            for (let i = 0; i < visible; i++) {
                const c = images[i];
                const dot = document.createElement('div');
                dot.className = 'img-dot' + (i === 0 ? ' active' : '');
                dot.onclick = () => {
                    resetAllImageZooms();
                    const left = c.offsetLeft - row.offsetLeft;
                    row.scrollTo({ left, behavior: 'smooth' });
                };
                holder.appendChild(dot);
            }
            if (total > maxDots) {
                const count = document.createElement('div');
                count.className = 'img-count';
                count.textContent = `1 / ${total}`;
                holder.appendChild(count);
            }
            setTimeout(updateImageIndicators, 40);
        }

        function updateImageIndicators() {
            const row = document.querySelector('.image-row');
            const dots = document.querySelectorAll('.img-dot');
            if (!row || dots.length === 0) return;
            const width = row.offsetWidth || 1;
            const activeIndex = Math.round(row.scrollLeft / width);
            dots.forEach((d, i) => d.classList.toggle('active', i === activeIndex));
            const count = document.querySelector('.img-count');
            if (count) {
                const total = row.querySelectorAll('.image-container').length;
                count.textContent = `${Math.min(activeIndex + 1, total)} / ${total}`;
            }
        }

        function imgNext() {
            resetAllImageZooms();
            const row = document.querySelector('.image-row');
            if (!row) return;
            const width = row.offsetWidth || 1;
            row.scrollTo({ left: row.scrollLeft + width, behavior: 'smooth' });
        }

        function imgPrev() {
            resetAllImageZooms();
            const row = document.querySelector('.image-row');
            if (!row) return;
            const width = row.offsetWidth || 1;
            row.scrollTo({ left: Math.max(0, row.scrollLeft - width), behavior: 'smooth' });
        }

        function deleteImage(btn) {
            const container = btn.closest('.image-container');
            if (!container) return;
            if (!confirm("Delete this image?")) return;
            container.remove();
            renderImageIndicators();
            saveServer();
        }

        let imageSelectMode = false;
        let lastImageSelectIndex = -1;
        let imageAutoPlay = false;
        let imageAutoTimer = null;
        let localAutoPlay = true;

        function ensureImageSelectionUI(row) {
            if (!row) return;
            row.querySelectorAll('.image-container').forEach(c => {
                if (!c.querySelector('.image-select')) {
                    const label = document.createElement('label');
                    label.className = 'image-select';
                    label.innerHTML = `<input type="checkbox" class="image-check"> Select`;
                    c.insertBefore(label, c.firstChild);
                    const checkbox = label.querySelector('input');
                    checkbox.addEventListener('change', () => {
                        c.classList.toggle('selected', checkbox.checked);
                    });
                    checkbox.addEventListener('click', (e) => {
                        if (!e.shiftKey) {
                            lastImageSelectIndex = getImageIndex(c);
                            return;
                        }
                        const rowEl = c.closest('.image-row');
                        if (!rowEl) return;
                        const containers = Array.from(rowEl.querySelectorAll('.image-container'));
                        const currentIndex = containers.indexOf(c);
                        if (lastImageSelectIndex < 0) {
                            lastImageSelectIndex = currentIndex;
                            return;
                        }
                        const [start, end] = lastImageSelectIndex < currentIndex
                            ? [lastImageSelectIndex, currentIndex]
                            : [currentIndex, lastImageSelectIndex];
                        for (let i = start; i <= end; i++) {
                            const target = containers[i];
                            const cb = target.querySelector('.image-check');
                            if (cb) {
                                cb.checked = true;
                                cb.dispatchEvent(new Event('change'));
                            }
                        }
                    });
                }
            });
        }

        function getImageIndex(container) {
            const row = container.closest('.image-row');
            if (!row) return -1;
            const containers = Array.from(row.querySelectorAll('.image-container'));
            return containers.indexOf(container);
        }

        function toggleImageSelectMode() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            imageSelectMode = !imageSelectMode;
            row.classList.toggle('select-mode', imageSelectMode);
            ensureImageSelectionUI(row);
            if (!imageSelectMode) {
                lastImageSelectIndex = -1;
            }
        }

        function selectAllImages() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            ensureImageSelectionUI(row);
            row.classList.add('select-mode');
            imageSelectMode = true;
            row.querySelectorAll('.image-check').forEach(cb => {
                cb.checked = true;
                cb.dispatchEvent(new Event('change'));
            });
        }

        function invertImageSelection() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            ensureImageSelectionUI(row);
            row.classList.add('select-mode');
            imageSelectMode = true;
            row.querySelectorAll('.image-check').forEach(cb => {
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
            });
        }

        function deleteSelectedImages() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            ensureImageSelectionUI(row);
            const selected = row.querySelectorAll('.image-container.selected');
            if (selected.length === 0) {
                status.textContent = "No images selected";
                setTimeout(() => status.textContent = "Ready", 1200);
                return;
            }
            if (!confirm(`Delete ${selected.length} selected image(s)?`)) return;
            selected.forEach(c => c.remove());
            renderImageIndicators();
            saveServer();
        }

        function deleteAllImages() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            const all = row.querySelectorAll('.image-container');
            if (all.length === 0) return;
            if (!confirm(`Delete ALL ${all.length} images?`)) return;
            all.forEach(c => c.remove());
            renderImageIndicators();
            saveServer();
        }

        function downloadAllImages() {
            const row = document.querySelector('.image-row');
            if (!row) return;
            const imgs = row.querySelectorAll('img');
            if (imgs.length === 0) return;
            if (!confirm(`Download ALL ${imgs.length} images?`)) return;
            const list = Array.from(imgs)
                .map(img => img.getAttribute('src'))
                .filter(Boolean)
                .map(url => url.split('/').pop()?.split('?')[0])
                .filter(Boolean);

            fetch("/download_images", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ files: list })
            }).then(res => {
                if (!res.ok) throw new Error("Download failed");
                return res.blob();
            }).then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'images.zip';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            }).catch(() => {
                alert("Could not create zip. Try again.");
            });
        }

        async function uploadImagesInBatches(files, batchSize = 25) {
            if (!files || files.length === 0) return;
            const total = files.length;
            let done = 0;

            for (let i = 0; i < files.length; i += batchSize) {
                const batch = files.slice(i, i + batchSize);
                for (const file of batch) {
                    await uploadSingleImage(file, () => {
                        done += 1;
                        status.textContent = `Uploading images ${done}/${total}`;
                    });
                }
            }

            status.textContent = "Ready";
            setTimeout(() => status.textContent = "Ready", 2000);
        }

        function uploadSingleImage(file, onDone) {
            return new Promise(resolve => {
                const container = getOrCreateImageCarousel();
                const row = container.querySelector('.image-row');
                const id = `img:${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
                const placeholderHtml = `
                    <div class="image-container" data-image-id="${id}">
                        <label class="image-select"><input type="checkbox" class="image-check"> Select</label>
                        <button class="image-delete" onclick="deleteImage(this)">✕</button>
                        <div class="image-card"></div>
                        <div class="image-upload-progress">
                            <div class="upload-bar"></div>
                            <div class="upload-text">0 MB / 0 MB</div>
                        </div>
                    </div>
                `;
                row.insertAdjacentHTML('beforeend', placeholderHtml);
                renderImageIndicators();

                const placeholder = row.querySelector(`.image-container[data-image-id="${id}"]`);
                const bar = placeholder ? placeholder.querySelector('.upload-bar') : null;
                const label = placeholder ? placeholder.querySelector('.upload-text') : null;
                if (placeholder) {
                    const cb = placeholder.querySelector('.image-check');
                    if (cb) {
                        cb.addEventListener('change', () => {
                            placeholder.classList.toggle('selected', cb.checked);
                        });
                        cb.addEventListener('click', (e) => {
                            if (!e.shiftKey) {
                                lastImageSelectIndex = getImageIndex(placeholder);
                                return;
                            }
                            const rowEl = placeholder.closest('.image-row');
                            if (!rowEl) return;
                            const containers = Array.from(rowEl.querySelectorAll('.image-container'));
                            const currentIndex = containers.indexOf(placeholder);
                            if (lastImageSelectIndex < 0) {
                                lastImageSelectIndex = currentIndex;
                                return;
                            }
                            const [start, end] = lastImageSelectIndex < currentIndex
                                ? [lastImageSelectIndex, currentIndex]
                                : [currentIndex, lastImageSelectIndex];
                            for (let i = start; i <= end; i++) {
                                const target = containers[i];
                                const cbox = target.querySelector('.image-check');
                                if (cbox) {
                                    cbox.checked = true;
                                    cbox.dispatchEvent(new Event('change'));
                                }
                            }
                        });
                    }
                }

                const formData = new FormData();
                formData.append("image", file);

                const xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload_image", true);
                xhr.upload.onprogress = function (evt) {
                    if ((!bar && !label) || !evt.lengthComputable) return;
                    const pct = Math.round((evt.loaded / evt.total) * 100);
                    if (bar) bar.style.width = pct + '%';
                    if (label) {
                        label.textContent = `${formatBytes(evt.loaded)} / ${formatBytes(evt.total)}`;
                    }
                };
                xhr.onload = function () {
                    if (!placeholder) {
                        resolve();
                        return;
                    }
                    if (xhr.status >= 200 && xhr.status < 300) {
                        let data = null;
                        try { data = JSON.parse(xhr.responseText); } catch (e) { }
                        const url = data && data.url ? data.url : null;
                        if (!url) {
                            placeholder.remove();
                            resolve();
                            if (onDone) onDone();
                            return;
                        }
                        placeholder.querySelector('.image-card').innerHTML = `<img src="${url}" alt="Image" />`;
                        const prog = placeholder.querySelector('.image-upload-progress');
                        if (prog) prog.remove();
                        const newImg = placeholder.querySelector('img');
                        if (newImg) setupImageCardAdaptive(newImg);
                        renderImageIndicators();
                        saveServer();
                        if (onDone) onDone();
                        resolve();
                    } else {
                        placeholder.remove();
                        if (onDone) onDone();
                        resolve();
                    }
                };
                xhr.onerror = function () {
                    if (placeholder) placeholder.remove();
                    if (onDone) onDone();
                    resolve();
                };
                xhr.send(formData);
            });
        }

        function getOrCreateVideoGrid() {
            let grid = paper.querySelector('.video-grid');

        // YouTube JS API variables and functions
        let ytPlayers = [];

        function initYouTubePlayers() {
            ytPlayers = [];
            document.querySelectorAll('.video-container iframe').forEach((iframe) => {
                iframe.setAttribute('scrolling', 'no');
                try {
                    const player = new YT.Player(iframe, {
                        events: {
                            onStateChange: onPlayerStateChange,
                            onError: onPlayerError
                        }
                    });
                    // Store the iframe element on the player object for easy reference if needed
                    player.getIframe().dataset.playerId = ytPlayers.length;
                    ytPlayers.push(player);
                } catch (e) {
                    console.warn("YouTube API not ready or error init player", e);
                }
            });
        }

        function playNextVideo(currentPlayer) {
            const currentIndex = ytPlayers.indexOf(currentPlayer);
            if (currentIndex !== -1 && currentIndex < ytPlayers.length - 1) {
                const nextPlayer = ytPlayers[currentIndex + 1];
                try {
                    // Scroll the carousel so the next video is visible
                    const row = document.querySelector('.video-row');
                    const containers = row ? row.querySelectorAll('.video-container') : null;
                    const nextContainer = containers ? containers[currentIndex + 1] : null;
                    if (nextContainer && row) {
                        const left = nextContainer.offsetLeft - row.offsetLeft;
                        row.scrollTo({ left: left, behavior: 'smooth' });
                        // ensure indicators update after scroll starts
                        setTimeout(updateIndicators, 250);
                    }

                    // Play the next video (audio + video will start in that iframe)
                    nextPlayer.playVideo();
                } catch (e) {
                    console.error("Error playing next video", e);
                    // If next video fails immediately, try the one after
                    try { playNextVideo(nextPlayer); } catch (_) { }
                }
            }
        }

        function onPlayerStateChange(event) {
            // Auto-pause others when one plays
            const playBtn = document.querySelector('.video-controls .play-btn');

            if (event.data === YT.PlayerState.PLAYING) {
                try {
                    const iframe = event.target.getIframe?.();
                    const container = iframe ? iframe.closest('.video-container') : null;
                    if (container) {
                        _activeContainer = container;
                        _activeVideoId = container.dataset.videoId || _activeVideoId;
                        const row = document.querySelector('.video-row');
                        if (row) {
                            const containers = row.querySelectorAll('.video-container');
                            _lastActiveIndex = Array.from(containers).indexOf(container);
                        }
                    }
                } catch (e) { }
                if (playBtn) {
                    playBtn.innerHTML = '<i data-lucide="pause"></i>';
                    lucide.createIcons();
                }
                ytPlayers.forEach(p => {
                    if (p !== event.target) {
                        try {
                            p.pauseVideo();
                        } catch (e) { }
                    }
                });
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                // If it's the active one (closest to center), update icon
                const isAnyPlaying = ytPlayers.some(p => {
                    try { return p.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) { return false; }
                });
                if (!isAnyPlaying && playBtn) {
                    playBtn.innerHTML = '<i data-lucide="play"></i>';
                    lucide.createIcons();
                }
            }

            // Playlist logic: Play next when ended
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo(event.target);
            }
        }

        function onPlayerError(event) {
            console.warn("Video error encountered, skipping...", event.data);
            // Error codes: 100, 101, 150 mean video unavailable/restricted. 
            // We skip to next video on any error to keep playlist going.
            playNextVideo(event.target);
        }

        // Pill progress updater
        let _pillInterval = null;
        let _localPillInterval = null;

        function updatePillProgress(container, rowSelector, containerSelector) {
            const targetContainer = container || document.querySelector('.video-carousel-container, .local-video-carousel-container');
            if (!targetContainer) return;

            const row = targetContainer.querySelector(rowSelector || '.video-row, .local-video-row');
            if (!row) return;

            const containers = row.querySelectorAll(containerSelector || '.video-container');
            if (!containers.length) return;

            const activeIndex = getActiveIndexByCenter(row);
            const activeContainer = containers[activeIndex] || null;

            const progressFill = targetContainer.querySelector('.video-progress-fill');
            const activeDotFill = targetContainer.querySelector('.indicators .dot.active .dot-fill, .local-indicators .dot.active .dot-fill');

            const setPct = (pct) => {
                const clamped = Math.max(0, Math.min(100, pct)) + '%';
                if (progressFill) progressFill.style.width = clamped;
                if (activeDotFill) activeDotFill.style.width = clamped;
            };

            if (!activeContainer) {
                setPct(0);
                return;
            }

            // 🔵 LOCAL VIDEO
            const localVideo = activeContainer.querySelector('video');
            if (localVideo) {
                const dur = localVideo.duration || 0;
                const cur = localVideo.currentTime || 0;
                const pct = dur > 0 ? (cur / dur) * 100 : 0;
                setPct(pct);
                return;
            }

            // 🔴 YOUTUBE
            if (typeof ytPlayers !== "undefined" && ytPlayers.length) {
                try {
                    const iframe = activeContainer.querySelector('iframe');
                    const player = ytPlayers[activeIndex] || ytPlayers.find(p => {
                        try { return p.getIframe() === iframe; } catch (e) { return false; }
                    });
                    if (player && typeof player.getDuration === 'function' && typeof player.getCurrentTime === 'function') {
                        const dur = player.getDuration();
                        const cur = player.getCurrentTime();
                        if (dur > 0) {
                            setPct((cur / dur) * 100);
                            return;
                        }
                    }
                } catch (e) { }
            }

            // Fallback: Real-time progress saved from YouTube postMessage
            if (activeContainer.dataset.progressPct) {
                setPct(parseFloat(activeContainer.dataset.progressPct));
            }
        }
        const ytContainer = document.querySelector('.video-carousel-container');

        updatePillProgress(
            ytContainer,
            '.video-row',
            '.video-container'
        );
        const localContainer = document.querySelector('.local-video-carousel-container');

        updatePillProgress(
            localContainer,
            '.local-video-row',
            '.video-container'
        );

        function startPillUpdater(container) {
            const target = container || document.querySelector('.video-carousel-container');
            if (!target) return;

            _pillInterval = setInterval(() => {

        function startLocalPillUpdater() {

            if (_localPillInterval) {

        // Hook into player state changes to start/stop updater
        const _origOnPlayerStateChange = onPlayerStateChange;
        onPlayerStateChange = function (event) {
            _origOnPlayerStateChange(event);
            if (event.data === YT.PlayerState.PLAYING) {
                startPillUpdater();
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                // stop if nothing is playing
                const isAnyPlaying = ytPlayers.some(p => {
                    try { return p.getPlayerState() === YT.PlayerState.PLAYING; } catch (e) { return false; }
                });
                if (!isAnyPlaying) stopPillUpdater();

        function seekLocalVideoByProgress(progressEl, clientX) {
            if (!progressEl) return;
            const container = progressEl.closest('.local-video-carousel-container');
            if (!container) return;
            const row = container.querySelector('.local-video-row');
            if (!row) return;

            const rect = progressEl.getBoundingClientRect();
            if (rect.width <= 0) return;
            const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));

            const containers = row.querySelectorAll('.video-container');
            const idx = getActiveIndexByCenter(row);
            const active = containers[idx];
            const video = active ? active.querySelector('video') : null;
            if (video && video.duration) {
                video.currentTime = pct * video.duration;
            }

            const fill = progressEl.querySelector('.video-progress-fill');
            if (fill) {
                fill.style.width = (pct * 100) + '%';
            }
            const activeDotFill = container.querySelector('.local-indicators .dot.active .dot-fill');
            if (activeDotFill) {
                activeDotFill.style.width = (pct * 100) + '%';
            }
        }

        let _isLocalScrubbing = false;
        let _activeLocalProgressEl = null;

        // Seek by clicking on progress bar or active dot
        document.addEventListener('click', (e) => {
            const localProgress = e.target.closest('.local-video-controls .video-progress');
            if (localProgress) {
                seekLocalVideoByProgress(localProgress, e.clientX);
                return;
            }

            const ytProgress = e.target.closest('.video-carousel-container .video-progress');
            if (ytProgress) {
                const container = ytProgress.closest('.video-carousel-container');
                if (!container) return;
                const rect = ytProgress.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const pct = Math.max(0, Math.min(1, x / rect.width));
                const row = container.querySelector('.video-row');
                if (!row) return;
                const activeIndex = Math.round(row.scrollLeft / (row.offsetWidth || 1));
                if (typeof ytPlayers !== "undefined" && ytPlayers[activeIndex]) {
                    try {
                        const player = ytPlayers[activeIndex];
                        const dur = player.getDuration();
                        player.seekTo(pct * dur, true);
                    } catch (err) { }
                }
                return;
            }

            const dot = e.target.closest('.dot');
            if (!dot || !dot.classList.contains('active')) return;

            const container = dot.closest('.video-carousel-container, .local-video-carousel-container');
            if (!container) return;

            const rect = dot.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const pct = Math.max(0, Math.min(1, x / rect.width));

            const row = container.querySelector('.video-row, .local-video-row');
            if (!row) return;

            const activeIndex = Math.round(row.scrollLeft / (row.offsetWidth || 1));
            const containers = row.querySelectorAll('.video-container');
            const activeContainer = containers[activeIndex];
            if (!activeContainer) return;

            const localVideo = activeContainer.querySelector('video');
            if (localVideo && localVideo.duration) {
                localVideo.currentTime = pct * localVideo.duration;
                updateLocalPillProgress();
                return;
            }

            if (typeof ytPlayers !== "undefined" && ytPlayers[activeIndex]) {
                try {
                    const player = ytPlayers[activeIndex];
                    const dur = player.getDuration();
                    player.seekTo(pct * dur, true);
                } catch (err) { }
            }
        });

        // Mouse drag scrubbing
        document.addEventListener('mousedown', (e) => {
            const localProgress = e.target.closest('.local-video-controls .video-progress');
            if (localProgress) {
                _isLocalScrubbing = true;

                seekLocalVideoByProgress(_activeLocalProgressEl, e.touches[0].clientX);

        function scrubToPercent(container, pct) {
            const targetContainer = container || document.querySelector('.local-video-carousel-container, .video-carousel-container');
            if (!targetContainer) return;
            const row = targetContainer.querySelector('.video-row, .local-video-row');
            if (!row) return;
            const activeIndex = Math.round(row.scrollLeft / (row.offsetWidth || 1));
            const containers = row.querySelectorAll('.video-container');
            const activeContainer = containers[activeIndex];
            if (!activeContainer) return;

            const localVideo = activeContainer.querySelector('video');
            if (localVideo && localVideo.duration) {
                localVideo.currentTime = pct * localVideo.duration;
                updateLocalPillProgress();
                return;
            }

            if (typeof ytPlayers !== "undefined" && ytPlayers[activeIndex]) {
                try {
                    const player = ytPlayers[activeIndex];
                    const dur = player.getDuration();
                    player.seekTo(pct * dur, true);

        function handleScrubEvent(e) {
            const dot = e.target.closest('.dot.active');
            if (!dot) return;
            const container = dot.closest('.video-carousel-container, .local-video-carousel-container');
            const rect = dot.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;

        /* Carousel UI Helpers */
        function renderIndicators(container, rowSelector) {
            const carousel = container || document.querySelector('.video-carousel-container');
            if (!carousel) return;

            const row = carousel.querySelector(rowSelector || '.video-row');
            let indicatorBar = carousel.querySelector('.indicators') || carousel.querySelector('.indicator-bar');
            const controls = carousel.querySelector('.video-controls');

            if (!indicatorBar) {
                indicatorBar = document.createElement('div');
                indicatorBar.className = 'indicators';
                carousel.appendChild(indicatorBar);
            }

            indicatorBar.innerHTML = '';
            if (!row) {
                if (controls) controls.style.display = 'none';
                return;
            }

            const containers = row.querySelectorAll('.video-container');
            if (containers.length === 0) {
                if (controls) controls.style.display = 'none';
                return;
            }

            if (controls) controls.style.display = 'flex';
            containers.forEach((c, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.innerHTML = '<div class="dot-fill"></div>';
                dot.onclick = () => {
                    const isLandscape = window.matchMedia && window.matchMedia('(max-height: 600px) and (orientation: landscape)').matches;
                    let scrollAmount = 0;
                    if (isLandscape) {
                        scrollAmount = c.offsetLeft - row.offsetLeft - (row.offsetWidth - c.offsetWidth) / 2;
                    } else {
                        const paddingLeft = parseFloat(window.getComputedStyle(row).paddingLeft) || 0;
                        scrollAmount = c.offsetLeft - row.offsetLeft - paddingLeft;
                    }
                    row.scrollTo({ left: Math.max(0, scrollAmount), behavior: 'smooth' });
                };
                indicatorBar.appendChild(dot);
            });
        }

        let _lastActiveIndex = 0;
        let _activeContainer = null;
        let _activeVideoId = null;
        let _lockActive = false;
        let _snapBackup = null;

        function getActiveIndexByCenter(row) {
            const containers = row.querySelectorAll('.video-container');
            if (!containers || containers.length === 0) return 0;
            if (containers.length === 1) return 0;

            const isLandscape = window.matchMedia && window.matchMedia('(max-height: 600px) and (orientation: landscape)').matches;
            const rowRect = row.getBoundingClientRect();
            let bestIdx = 0;
            let bestDist = Infinity;

            if (isLandscape) {
                const rowCenter = rowRect.left + rowRect.width / 2;
                containers.forEach((c, i) => {
                    const rect = c.getBoundingClientRect();
                    const center = rect.left + rect.width / 2;
                    const dist = Math.abs(center - rowCenter);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = i;
                    }
                });
            } else {
                const paddingLeft = parseFloat(window.getComputedStyle(row).paddingLeft) || 0;
                const targetLeft = rowRect.left + paddingLeft;
                containers.forEach((c, i) => {
                    const rect = c.getBoundingClientRect();
                    const dist = Math.abs(rect.left - targetLeft);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestIdx = i;
                    }
                });
            }

            return bestIdx;
        }

        function findContainerByVideoId(row, videoId) {
            if (!videoId) return null;
            return row.querySelector(`.video-container[data-video-id="${videoId}"]`);
        }

        function resolveActiveContainer(row) {
            if (_activeContainer && row.contains(_activeContainer)) return _activeContainer;
            const byId = findContainerByVideoId(row, _activeVideoId);
            if (byId) return byId;
            const idx = getActiveIndexByCenter(row);
            const containers = row.querySelectorAll('.video-container');
            return containers[idx] || null;
        }

        function rememberActiveIndex(container) {
            if (!container) return;

            const row = container.querySelector('.video-row, .local-video-row');
            if (!row) return;

            const containers = row.querySelectorAll('.video-container');
            if (!containers.length) return;

            const activeIndex = Math.round(
                row.scrollLeft / (row.offsetWidth || 1)
            );

            const activeContainer = containers[activeIndex] || null;

            // Store state per container
            container._activeContainer = activeContainer || null;
            container._lastActiveIndex = activeIndex;

            if (activeContainer) {
                container._activeVideoId =
                    activeContainer.dataset.videoId || null;
            }
        }
        rememberActiveIndex();


        function realignCarouselToActive() {
            const row = document.querySelector('.video-row');
            if (!row) return;
            const containers = row.querySelectorAll('.video-container');
            if (!containers || containers.length === 0) return;

            const clamped = Math.max(0, Math.min(_lastActiveIndex, containers.length - 1));
            const target = resolveActiveContainer(row) || containers[clamped];
            _activeContainer = target;
            _activeVideoId = target ? (target.dataset.videoId || _activeVideoId) : _activeVideoId;

            const isLandscape = window.matchMedia && window.matchMedia('(max-height: 600px) and (orientation: landscape)').matches;
            const rowRect = row.getBoundingClientRect();
            const targetRect = target.getBoundingClientRect();
            let delta = 0;

            if (isLandscape) {
                const rowCenter = rowRect.left + rowRect.width / 2;
                const targetCenter = targetRect.left + targetRect.width / 2;
                delta = targetCenter - rowCenter;
            } else {
                const paddingLeft = parseFloat(window.getComputedStyle(row).paddingLeft) || 0;
                delta = targetRect.left - (rowRect.left + paddingLeft);
            }

            const nextLeft = row.scrollLeft + delta;
            row.scrollTo({ left: Math.max(0, nextLeft), behavior: 'smooth' });
            updateIndicators();

            if (_snapBackup !== null) {
                row.style.scrollSnapType = _snapBackup;
                _snapBackup = null;
            }
            _lockActive = false;
        }

        function updateIndicators() {
            const carouselContainer = document.querySelector('.video-carousel-container');
            const row = carouselContainer ? carouselContainer.querySelector('.video-row') : document.querySelector('.video-row');
            if (!row) return;

            const containers = row.querySelectorAll('.video-container');
            const controls = carouselContainer ? carouselContainer.querySelector('.video-controls') : null;
            if (containers.length === 0) {
                if (controls) controls.style.display = 'none';
                return;
            }
            if (controls) controls.style.display = 'flex';

            let activeIndex = getActiveIndexByCenter(row);
            if (_lockActive) {
                const locked = resolveActiveContainer(row);
                if (locked) {
                    activeIndex = Array.from(containers).indexOf(locked);
                }
            } else {
                _activeContainer = containers[activeIndex] || null;
                _activeVideoId = _activeContainer ? (_activeContainer.dataset.videoId || _activeVideoId) : _activeVideoId;
            }
            _lastActiveIndex = Math.max(0, activeIndex);

            containers.forEach((c, i) => {
                c.classList.toggle('is-active', i === activeIndex);
            });

            const dots = carouselContainer ? carouselContainer.querySelectorAll('.indicators .dot') : document.querySelectorAll('.indicators .dot');
            dots.forEach((dot, i) => {
                const isActive = (i === activeIndex);
                dot.classList.toggle('active', isActive);
                const fill = dot.querySelector('.dot-fill');
                if (fill && !isActive) {
                    fill.style.width = '0%';
                }
            });

            // Synchronize play button icon with current active video in view
            if (_activeContainer) {
                const localV = _activeContainer.querySelector('video');
                const isPlaying = localV ? !localV.paused : (_activeContainer.dataset.isPlaying === 'true');
                updateGlobalPlayButton(isPlaying, carouselContainer);
            }
            updatePillProgress(carouselContainer, '.video-row', '.video-container');
        }

        function renderLocalIndicators() {
            const container = document.querySelector('.local-video-carousel-container');
            const row = container ? container.querySelector('.local-video-row') : document.querySelector('.local-video-row');
            const indicatorContainer = container ? container.querySelector('.local-indicators') : document.querySelector('.local-indicators');
            if (!row || !indicatorContainer) return;

            const videos = row.querySelectorAll('.video-container');
            indicatorContainer.innerHTML = '';
            if (videos.length <= 1) {
                indicatorContainer.style.display = 'none';
            } else {
                indicatorContainer.style.display = 'inline-flex';
                videos.forEach((v, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.innerHTML = '<div class="dot-fill"></div>';
                    dot.onclick = () => {
                        const isLandscape = window.matchMedia && window.matchMedia('(max-height: 600px) and (orientation: landscape)').matches;
                        let scrollAmount = 0;
                        if (isLandscape) {
                            scrollAmount = v.offsetLeft - row.offsetLeft - (row.offsetWidth - v.offsetWidth) / 2;
                        } else {
                            const paddingLeft = parseFloat(window.getComputedStyle(row).paddingLeft) || 0;
                            scrollAmount = v.offsetLeft - row.offsetLeft - paddingLeft;
                        }
                        row.scrollTo({ left: Math.max(0, scrollAmount), behavior: 'smooth' });
                    };
                    indicatorContainer.appendChild(dot);
                });
            }

            setTimeout(updateLocalIndicators, 40);
        }

        function updateLocalPillProgress() {
            const container = document.querySelector('.local-video-carousel-container');

            const progressFill = container.querySelector('.video-progress-fill');

            const pct = Math.max(0, Math.min(100, (video.currentTime / video.duration) * 100));

        function pauseAllOtherVideos(currentEl) {

            document.querySelectorAll('.video-container video').forEach(v => {

            // Pause all YouTube iframes
            document.querySelectorAll('.video-container iframe').forEach(f => {

        }

        function ensureIframeJsApi(iframe) {
            if (!iframe) return;

        // Combined play/pause toggle for both local and YouTube videos, based on exactly active video in view
        function togglePlayPause(btn) {
            const carousel = (btn && btn.closest('.video-carousel-container, .local-video-carousel-container'))
                          || document.querySelector('.video-carousel-container, .local-video-carousel-container');
            if (!carousel) return;

            const row = carousel.querySelector('.video-row, .local-video-row') || document.querySelector('.video-row, .local-video-row');
            if (!row) return;

            const containers = Array.from(row.querySelectorAll('.video-container'));
            if (!containers.length) return;

            let activeContainer = resolveActiveContainer(row);
            if (!activeContainer) {
                const idx = getActiveIndexByCenter(row);
                activeContainer = containers[idx] || containers[0];
            }
            if (!activeContainer) return;

            // 1. Local HTML5 video check
            const localVideo = activeContainer.querySelector('video');
            if (localVideo) {
                if (localVideo.paused) {
                    pauseAllOtherVideos(localVideo);
                    localVideo.play().then(() => {
                        updateGlobalPlayButton(true, carousel);
                        updateLocalControlsButton(true);
                    }).catch(() => { });
                } else {
                    localVideo.pause();
                    updateGlobalPlayButton(false, carousel);
                    updateLocalControlsButton(false);
                }
                return;
            }

            // 2. YouTube iframe check
            const iframe = activeContainer.querySelector('iframe');
            if (iframe) {
                ensureIframeJsApi(iframe);
                const isCurrentlyPlaying = activeContainer.dataset.isPlaying === 'true';
                const nextPlaying = !isCurrentlyPlaying;
                const cmd = nextPlaying ? 'playVideo' : 'pauseVideo';

                if (nextPlaying) {
                    pauseAllOtherVideos(iframe);
                }

                // Send postMessage directly to YouTube iframe
                if (iframe.contentWindow) {
                    iframe.contentWindow.postMessage(JSON.stringify({
                        event: 'command',
                        func: cmd,
                        args: ''
                    }), '*');
                }

                // Also call YouTube Player API instance if available
                if (typeof ytPlayers !== 'undefined' && ytPlayers.length) {
                    const activeIndex = containers.indexOf(activeContainer);
                    const player = ytPlayers[activeIndex] || ytPlayers.find(p => {
                        try { return p.getIframe() === iframe; } catch (e) { return false; }
                    });
                    if (player && typeof player[cmd] === 'function') {
                        try { player[cmd](); } catch (e) { }
                    }
                }

                activeContainer.dataset.isPlaying = nextPlaying ? 'true' : 'false';
                updateGlobalPlayButton(nextPlaying, carousel);
            }
        }

        function updateGlobalPlayButton(isPlaying, container) {
            const parent = container || document.querySelector('.video-carousel-container, .local-video-carousel-container');
            const playBtn = parent ? parent.querySelector('.play-btn') : document.querySelector('.video-controls .play-btn');
            if (!playBtn) return;
            playBtn.innerHTML = isPlaying ? '<i data-lucide="pause"></i>' : '<i data-lucide="play"></i>';
            lucide.createIcons();
        }

        // Real-time synchronization with YouTube iframe player states & progress
        window.addEventListener('message', function (e) {
            try {
                const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (!data || data.event !== 'infoDelivery' || !data.info) return;

                const row = document.querySelector('.video-row');
                const carousel = document.querySelector('.video-carousel-container');
                if (!row) return;

                const activeContainer = resolveActiveContainer(row) || row.querySelector('.video-container.is-active');

                // 1. Play / Pause state synchronization
                if (typeof data.info.playerState === 'number') {
                    // 1 = playing, 2 = paused, 0 = ended
                    const isPlaying = (data.info.playerState === 1);
                    if (activeContainer && activeContainer.querySelector('iframe')) {
                        activeContainer.dataset.isPlaying = isPlaying ? 'true' : 'false';
                        updateGlobalPlayButton(isPlaying, carousel);
                    }
                    if (isPlaying) {
                        startPillUpdater(carousel);
                    }
                }

                // 2. Real-time progress bar fill synchronization
                if (typeof data.info.currentTime === 'number' || typeof data.info.duration === 'number') {
                    if (activeContainer) {
                        if (typeof data.info.duration === 'number' && data.info.duration > 0) {
                            activeContainer.dataset.ytDuration = data.info.duration;
                        }
                        if (typeof data.info.currentTime === 'number') {
                            activeContainer.dataset.ytCurrentTime = data.info.currentTime;
                        }
                        const dur = parseFloat(activeContainer.dataset.ytDuration || 0);
                        const cur = parseFloat(activeContainer.dataset.ytCurrentTime || 0);
                        if (dur > 0) {
                            const pct = Math.max(0, Math.min(100, (cur / dur) * 100));
                            activeContainer.dataset.progressPct = pct;
                            const activeDotFill = carousel ? carousel.querySelector('.indicators .dot.active .dot-fill') : document.querySelector('.indicators .dot.active .dot-fill');
                            const progressFill = carousel ? carousel.querySelector('.video-progress-fill') : document.querySelector('.video-progress-fill');
                            const widthVal = pct + '%';
                            if (activeDotFill) activeDotFill.style.width = widthVal;
                            if (progressFill) progressFill.style.width = widthVal;
                        }
                    }
                }
            } catch (_) { }
        });
